opencollection: 1.0.0

info:
  name: deko
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    mode: bearer
    bearer:
      token: "{{ADMIN_TOKEN}}"
  variables:
    - name: BASE_URL
      value: http://localhost:8000
    - name: SIM_URL
      value: http://localhost:5000
    - name: ADMIN_TOKEN
      value: ""
    - name: SERVICE_ID
      value: fac44a62-b44d-4782-a12c-8c4513c3ef23
    - name: TOKEN_ID
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
